<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landlord Page</title>
    <link href="/css/styles.css" rel="stylesheet">
    <!-- Include the external JavaScript file -->
    <script src="/js/scripts.js" defer></script>
    <!-- Include Google Places API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBOCJ2YPgxUgLwt0C0m3N9xEOZ2m4AcS5A&libraries=places"></script>
</head>
<body class="landlord-page-bg">

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="navbar-container">
        <span class="navbar-title">Landlord Page</span>
        <a href="/index" class="navbar-link">Home</a>
    </div>
</nav>

<!-- Property Search Section -->
<div class="content-wrapper">
    <h2>Search for a Property</h2>
    <form method="GET" action="/landlordSearch">
        <input id="search-property" name="address" class="form-control" type="text" placeholder="Enter a property address" required>
        <button type="submit" class="btn-primary">Search</button>
    </form>
</div>

<!-- Display Property Details Section -->
<div id="property-details" class="content-wrapper" style="display: none;"> <!-- Initially hidden -->
    <h2>Property Details</h2>
    <!-- Show property details if a match is found -->
    <div th:if="${property != null}">
        <p><strong>Property Name:</strong> <span th:text="${property.propertyName}"></span></p>
        <p><strong>Location:</strong>
            <span id="property-location" data-location="${property.location}" th:text="${property.location}"></span>
        </p>
        <p><strong>Hygiene Rating:</strong> <span th:text="${property.hygiene}"></span></p>
        <p><strong>Safety Rating:</strong> <span th:text="${property.safety}"></span></p>
        <p><strong>Crowding Rating:</strong> <span th:text="${property.crowding}"></span></p>
        <p><strong>Tenant Comments:</strong> <span th:text="${property.comments}"></span></p>
        <p><strong>Landlord Comments:</strong> <span th:text="${property.landlordComment}"></span></p>
    </div>

    <!-- Show error message if no property is found -->
    <div th:if="${error != null}">
        <p class="error-message" th:text="${error}"></p>
    </div>
</div>


<!-- Google Maps Section -->
<div id="property-map" class="content-wrapper" style="width: 100%; height: 400px; margin-bottom: 20px;">
    <h2>Google Maps Location</h2>
</div>

<!-- Google Street View Section -->
<div id="street-view" class="content-wrapper" style="width: 100%; height: 400px;">
    <h2>Google Street View</h2>
</div>

<!-- Add Comment Section -->
<div class="content-wrapper" th:if="${property != null}">
    <h2>Add Your Comments</h2>
    <form method="POST" action="/submitLandlord">
        <input type="hidden" id="property-address" name="address" th:value="${property.location}">
        <div class="mb-3">
            <label for="comment" class="form-label">Comment:</label>
            <textarea id="comment" name="comment" class="form-control" rows="5" placeholder="Write your comment here..." required></textarea>
        </div>
        <button type="submit" class="btn-primary">Submit Comment</button>
    </form>
</div>

<script>
    // Initialize Google Maps and Street View based on property details
    window.addEventListener("load", function() {
        const mapElement = document.getElementById("property-map");
        const streetViewElement = document.getElementById("street-view");
        const propertyLocationElement = document.getElementById("property-location");

        if (propertyLocationElement) {
            const address = propertyLocationElement.getAttribute("data-location");
            if (address) {
                const geocoder = new google.maps.Geocoder();
                geocoder.geocode({ address: address }, function(results, status) {
                    if (status === "OK") {
                        const location = results[0].geometry.location;

                        // Initialize Google Maps
                        new google.maps.Map(mapElement, {
                            center: location,
                            zoom: 15,
                        });

                        // Initialize Google Street View
                        new google.maps.StreetViewPanorama(streetViewElement, {
                            position: location,
                            pov: { heading: 34, pitch: 10 },
                            zoom: 1,
                        });
                    } else {
                        console.error("Geocoding failed: " + status);
                    }
                });
            }
        }
    });
</script>

</body>
</html>
