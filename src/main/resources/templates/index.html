<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tenant Review Platform"> <!-- Meta description for SEO -->
    <title>Tenant Voice</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- Link to the external CSS file for styling -->
</head>
<body class="custom-bg"> <!-- Custom background styling for the index page -->

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="navbar-container">
        <!-- Title displayed in the navigation bar -->
        <span class="navbar-title">Tenant Voice</span>
        <!-- Buttons to navigate between the Register and Login sections -->
        <div class="navbar-buttons">
            <!-- Button to show the Register section -->
            <a href="#" class="navbar-link" id="show-register">Register</a>
            <!-- Link to the Login section -->
            <a href="#login" class="navbar-link">Login</a>
        </div>
    </div>
</nav>

<!-- Register Section -->
<!-- This section is initially hidden using inline CSS style -->
<div id="register" class="content-wrapper" style="display: none;">
    <h2>Register</h2>
    <form id="register-form" action="/registerUser" method="POST">
        <!-- Input field for user's name -->
        <div class="form-group">
            <label for="register-name" class="form-label">Name</label>
            <input type="text" id="register-name" name="name" class="form-control" placeholder="Enter your name" required>
        </div>
        <!-- Input field for user's email -->
        <div class="form-group">
            <label for="register-email" class="form-label">Email</label>
            <input type="email" id="register-email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <!-- Input field for user's phone number -->
        <div class="form-group">
            <label for="register-phone" class="form-label">Phone</label>
            <input type="tel" id="register-phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
        </div>
        <!-- Input field for user's password -->
        <div class="form-group">
            <label for="register-password" class="form-label">Password</label>
            <input type="password" id="register-password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <!-- Role selection as buttons -->
        <div class="form-group">
            <label class="form-label">Role</label>
            <div class="btn-group">
                <button type="button" class="btn btn-primary role-btn" data-role="Tenant">I am a Tenant</button>
                <button type="button" class="btn btn-primary role-btn" data-role="Landlord">I am a Landlord</button>
            </div>
            <input type="hidden" id="role" name="role" value="" required>
        </div>
        <!-- File upload for proof of identity -->
        <div class="form-group">
            <label for="proof-upload" class="form-label">Proof</label>
            <input type="file" id="proof-upload" class="form-control" required>
        </div>
        <!-- Register Button -->
        <button type="submit" class="btn-primary">Register</button>
    </form>
</div>

<!-- Login Section -->
<!-- This section is always visible -->
<div id="login" class="content-wrapper">
    <h2>Login</h2>
    <form id="login-form" action="/loginUser" method="POST">
        <!-- Input field for user's email -->
        <div class="form-group">
            <label for="login-email" class="form-label">Email</label>
            <input type="email" id="login-email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>
        <!-- Input field for user's password -->
        <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <!-- Button to submit the login form -->
        <button type="submit" class="btn-primary">Login</button>
    </form>
</div>

<!-- Footer -->
<!-- Footer for the page -->
<footer>
    © 2024 Tenant Voice. All Rights Reserved.
</footer>

<!-- Link to the external JavaScript file for interactivity -->
<script src="/js/scripts.js"></script>
</body>
</html>
