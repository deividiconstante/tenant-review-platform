<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tenant Review Platform">
    <meta name="author" content="Suellen Luz">
    <title>Tenant Voice</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700" rel="stylesheet">
</head>
<body class="custom-bg">
<!-- Navigation Bar -->
<nav class="navbar-index">
    <span class="navbar-index-title">Tenant Voice</span>
    <span class="navbar-index-subtitle">Welcome! Share your experiences as a Tenant or Landlord.</span>
</nav>

<!-- Main Section -->
<div class="content-wrapper">
    <h2>Register</h2>
    <form id="register-form">
        <!-- Name Field -->
        <div class="form-group">
            <label for="register-name" class="form-label">Name</label>
            <input type="text" id="register-name" class="form-control" placeholder="Enter your name" required>
        </div>

        <!-- Email Field -->
        <div class="form-group">
            <label for="register-email" class="form-label">Email</label>
            <input type="email" id="register-email" class="form-control" placeholder="Enter your email" required>
        </div>

        <!-- Phone Field -->
        <div class="form-group">
            <label for="register-phone" class="form-label">Phone</label>
            <input type="tel" id="register-phone" class="form-control" placeholder="Enter your phone number" required>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="register-password" class="form-label">Create Your Password</label>
            <input type="password" id="register-password" class="form-control" placeholder="Create a password" required>
        </div>

        <!-- File Upload -->
        <div class="form-group">
            <label for="proof-upload" class="form-label">Upload proof that you are a Tenant or a Landlord</label>
            <input type="file" id="proof-upload" class="form-control" accept=".pdf,.jpg,.png" required>
        </div>

        <!-- User Type Selection -->
        <p class="form-label">Choose your user type</p>
        <div class="btn-group">
            <button type="button" class="btn btn-primary">I am a Tenant</button>
            <button type="button" class="btn btn-primary">I am a Landlord</button>
        </div>
    </form>

    <h2>Login</h2>
    <form id="login-form">
        <!-- Email Field -->
        <div class="form-group">
            <label for="login-email" class="form-label">Email</label>
            <input type="email" id="login-email" class="form-control" placeholder="Enter your email" required>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>

<!-- Footer -->
<footer class="index-footer">
    © 2024 Tenant Voice. All Rights Reserved.
</footer>

<script src="/js/scripts.js"></script>
</body>
</html>
