<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Tenant Review Platform" />
    <meta name="author" content="Deividi Constante" />
    <title>Tenant Review Platform</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Font Awesome icons for additional styling -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google Fonts for custom typography -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700" rel="stylesheet" />
    <!-- Core theme CSS -->
    <link href="/css/styles.css?v=1.0" rel="stylesheet">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <div class="container">
        <!-- Brand -->
        <a class="navbar-brand" href="#">Tenant Reviews</a>
        <!-- Toggler for mobile navigation -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#register">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="#login">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="#search">Search Properties</a></li>
                <li class="nav-item"><a class="nav-link" href="#review">Review Properties</a></li>
                <!-- Links to other pages -->
                <li class="nav-item"><a class="nav-link" href="/tenant">Tenant Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/landlord">Landlord Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin">Admin Dashboard</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Register Section -->
<section id="register" class="container my-5">
    <h2>Register</h2>
    <form>
        <!-- Username field -->
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <!-- Email field -->
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <!-- Password field -->
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</section>

<!-- Login Section -->
<section id="login" class="container my-5">
    <h2>Login</h2>
    <form>
        <!-- Email field -->
        <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" required>
        </div>
        <!-- Password field -->
        <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</section>

<!-- Search Properties Section -->
<section id="search" class="container my-5">
    <h2>Search Properties</h2>
    <form>
        <!-- Search query field -->
        <div class="mb-3">
            <label for="searchQuery" class="form-label">Search</label>
            <input type="text" class="form-control" id="searchQuery" placeholder="Enter address or landlord name" required>
        </div>
        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <div id="searchResults" class="mt-4">
        <!-- Placeholder for dynamic search results -->
    </div>
</section>

<!-- Review Properties Section -->
<section id="review" class="container my-5">
    <h2>Review Property</h2>
    <form>
        <!-- Property name field -->
        <div class="mb-3">
            <label for="propertyName" class="form-label">Property Name</label>
            <input type="text" class="form-control" id="propertyName" required>
        </div>
        <!-- Rating field -->
        <div class="mb-3">
            <label for="rating" class="form-label">Rating</label>
            <select class="form-select" id="rating">
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>
        </div>
        <!-- Review text area -->
        <div class="mb-3">
            <label for="reviewText" class="form-label">Review</label>
            <textarea class="form-control" id="reviewText" rows="4"></textarea>
        </div>
        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
</section>

<!-- Footer -->
<footer class="bg-light text-center py-4">
    <div class="container">
        <p class="text-muted">&copy; 2024 Tenant Review Platform. All Rights Reserved.</p>
    </div>
</footer>

<!-- Bootstrap JS for interactive components -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="/js/scripts.js?v=1.0"></script>

</body>
</html>
