<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBOCJ2YPgxUgLwt0C0m3N9xEOZ2m4AcS5A&callback=initMap" async defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Property Reviews</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/forms}">Submit Review</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/properties}">View Properties</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Header Section with Map Background -->
<header class="header-with-map">
    <!-- Google Map container -->
    <div id="map"></div>
    <!-- Overlay content -->
    <div class="header-content text-white text-center">
        <h1 class="display-5">Welcome to Tenant Property Reviews</h1>
        <p class="lead">Find and review properties in Dublin with ease.</p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a class="btn btn-primary btn-lg" th:href="@{/tenant}">Tenant</a>
            <a class="btn btn-outline-light btn-lg" th:href="@{/landlord}">Landlord</a>
            <a class="btn btn-outline-light btn-lg" th:href="@{/admin}">Admin</a>
        </div>
    </div>
</header>

<script>
    function initMap() {
        const dublin = { lat: 53.3498, lng: -6.2603 };
        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: dublin,
            disableDefaultUI: true // Hide default controls
        });
        new google.maps.Marker({
            position: dublin,
            map: map
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
